<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171512" />
    <title>Camila Valle | Instagram</title>
    <style>
      :root {
        --bg: #0f1717;
        --panel: #152327;
        --panel-2: #1c2e32;
        --gold: #45d3c3;
        --gold-soft: #9cf1e5;
        --text: #f6f1ea;
        --muted: #d7d0c8;
        --shadow: rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        padding: 28px 18px 52px;
      }

      .page {
        width: min(100%, 560px);
      }

      .hero-image {
        width: 100%;
        height: 170px;
        border-radius: 22px 22px 0 0;
        background-image: url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1200&q=80');
        background-size: cover;
        background-position: center;
        border: 2px solid rgba(69, 211, 195, 0.9);
        border-bottom: none;
        box-shadow: 0 18px 30px rgba(0, 0, 0, 0.18);
      }

      .profile-wrap {
        display: flex;
        justify-content: center;
        margin-top: -66px;
      }

      .profile-photo {
        width: 170px;
        height: 170px;
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid rgba(69, 211, 195, 0.9);
        background: #1a1a1a;
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.28);
      }

      .profile-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .content {
        padding: 8px 18px 18px;
        background: linear-gradient(180deg, rgba(21,18,15,0.98), rgba(26,23,20,0.98));
        border-radius: 0 0 20px 20px;
        box-shadow: 0 12px 28px var(--shadow);
      }

      h1 {
        margin: 18px 0 14px;
        text-align: center;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .meta-row {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px 18px;
        color: var(--text);
        font-size: 1.02rem;
        font-weight: 600;
      }

      .meta-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        opacity: 0.96;
      }

      .halter-icon {
        width: 20px;
        height: 20px;
        display: inline-block;
        vertical-align: middle;
        fill: #45d3c3;
        filter: drop-shadow(0 0 4px rgba(69, 211, 195, 0.45));
      }

      .choose {
        margin: 30px 0 18px;
        text-align: center;
        font-size: clamp(1.3rem, 2vw, 2.05rem);
        font-weight: 500;
        color: #f1ece5;
      }

      .link-list {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .cta {
        display: flex;
        align-items: center;
        gap: 18px;
        width: 100%;
        min-height: 92px;
        padding: 16px 18px;
        border: 2px solid rgba(69, 211, 195, 0.9);
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(69,211,195,0.12), rgba(24,129,145,0.08));
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
        text-decoration: none;
        color: var(--text);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .cta:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 20px rgba(0, 0, 0, 0.16);
      }

      .icon-circle {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--gold);
        color: #1b1712;
        font-size: 1.6rem;
        font-weight: 700;
        flex-shrink: 0;
      }

      .cta-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
        line-height: 1.15;
      }

      .cta-title {
        font-size: clamp(1.05rem, 2vw, 1.7rem);
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .cta-sub {
        font-size: 0.98rem;
        color: rgba(246, 241, 234, 0.82);
      }

      .academy {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 94px;
        padding: 16px 18px;
        border: 2px solid rgba(69, 211, 195, 0.9);
        border-radius: 20px;
        background: rgba(69, 211, 195, 0.06);
        text-decoration: none;
        color: var(--text);
      }

      .academy .cta-text {
        flex: 1;
      }

      .chevron {
        font-size: 2rem;
        color: var(--gold-soft);
        transform: translateY(-2px);
      }

      @media (max-width: 420px) {
        .content {
          padding-left: 12px;
          padding-right: 12px;
        }

        .meta-row {
          font-size: 0.9rem;
        }

        .cta {
          gap: 12px;
          padding: 14px 12px;
        }

        .icon-circle {
          width: 48px;
          height: 48px;
          font-size: 1.3rem;
        }
      }
    </style>
  </head>
